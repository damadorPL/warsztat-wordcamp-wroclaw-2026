# Konfiguracja OpenHands (config.toml)

[mcp]
# Lokalny proces stdio z proxy WordPress Playground
[[mcp.stdio_servers]]
name = "novamira-playground"
command = "npx"
args = ["-y", "@automattic/mcp-wordpress-remote"]
env = { WP_API_URL = "http://127.0.0.1:9400/wp-json/mcp/novamira", WP_API_USERNAME = "admin", WP_API_PASSWORD = "<TWOJE_HASLO_APLIKACJI>" }

# Alternatywny zdalny serwer Streamable HTTP
shttp_servers = [
  "http://localhost:9400/wp-json/mcp/novamira"
]
