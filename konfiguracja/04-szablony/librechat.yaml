# Konfiguracja LibreChat (librechat.yaml)
version: 1.1.5

mcpSettings:
  allowedDomains:
    - "localhost"
    - "127.0.0.1"
    - "host.docker.internal"

mcpServers:
  novamira-playground:
    type: sse
    url: "http://host.docker.internal:9400/wp-json/mcp/novamira/sse"
    timeout: 60000
    headers:
      Authorization: "Basic <ZAKODOWANY_BASE64_USER_PASSWORD>"

  filesystem:
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - "/app/data"
